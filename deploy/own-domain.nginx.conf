# The website on its own domain (e.g. bigonegarage.ru) after `npm run build:root`.
# Copy dist/client/ to /var/www/bigone-site and include this server block.
# Leads go straight to the CRM (site.json → leadsUrl), so nothing else has to run on this server.
server {
    listen 80;
    server_name bigonegarage.ru www.bigonegarage.ru;
    # After `certbot --nginx -d bigonegarage.ru -d www.bigonegarage.ru` this block also serves HTTPS.
    root /var/www/bigone-site;
    index index.html;
    charset utf-8;

    location / {
        # Prices and price directions are separate prerendered pages: /prices.html, /uslugi/<slug>.html.
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # Optional: e-mail leads through the Node server (leadsUrl: null in site.json, `npm start` on port 5191).
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5191;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 16k;
    # }

    location ~* ^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(webp|jpe?g|png|svg)$ {
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
