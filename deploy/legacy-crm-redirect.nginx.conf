# Include only inside the server block that used to serve enVA's /big-site/.
location = /big-site { return 301 https://bigonegarage.ru/$is_args$args; }
location = /big-site/ { return 301 https://bigonegarage.ru/$is_args$args; }
location = /big-site/index.html { return 301 https://bigonegarage.ru/$is_args$args; }
location ~ ^/big-site/(?<garage_page>prices|uslugi/[a-z0-9-]+)(?:\.html)?/?$ {
    return 301 https://bigonegarage.ru/$garage_page.html$is_args$args;
}
location = /big-site/sitemap.xml { return 301 https://bigonegarage.ru/sitemap.xml; }
location = /big-site/robots.txt { return 301 https://bigonegarage.ru/robots.txt; }
