# Inside the existing envacrm.ru server block.
# Main `npm run build` creates /opt/enva-business/dist/client/big-site/.
# For the site on its own domain use own-domain.nginx.conf instead.
location = /big-site { return 308 /big-site/; }
location ^~ /big-site/api/ {
    proxy_pass http://127.0.0.1:5191;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
}
location ^~ /big-site/ {
    root /opt/enva-business/dist/client;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /big-site/404.html;
    # Vite build files carry a content hash in the name: keep them for a year.
    location ~* ^/big-site/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Photos and icons keep their names when replaced: a week, then revalidate.
    location ~* \.(webp|jpe?g|png|svg)$ {
        add_header Cache-Control "public, max-age=604800";
    }
    # Pages always revalidate so a new release is picked up at once.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
